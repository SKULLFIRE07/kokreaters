<!doctype html>
<!--
  KoKreaters Open Graph card (REDESIGN-V3 §1, §2). 1200×630.
  Rendered by scripts/og.mjs through headless Chrome; never shipped as a page.
  Navy-900 field, the white horizontal lockup (vector, inline, never recoloured), an uppercase Inter label in blue-300
  (8.1:1 on navy) behind a short accent rule, the page H1 in Source Serif 4 (white, optical sizing on), and a hairline
  footer with the domain. No grid, no colour bars, no stickers: the same restraint as the site.
  og.mjs fills the LABEL, TITLE and LOGO placeholders and serves the self-hosted woff2 files from public/fonts.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, height=630">
<style>
  @font-face {
    font-family: "Bodoni Moda";
    src: url("/fonts/bodoni-moda-latin-opsz-normal.woff2") format("woff2");
    font-weight: 400 900; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: "Manrope";
    src: url("/fonts/manrope-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900; font-style: normal; font-display: block;
  }
  :root { --navy-900: #0E1F4D; --blue-300: #E8A93A; --blue-500: #1C3F94; --on-navy-2: rgba(255, 255, 255, .74); --rule: rgba(255, 255, 255, .18); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--navy-900); color: #FFFFFF;
    -webkit-font-smoothing: antialiased; font-kerning: normal; font-optical-sizing: auto;
  }
  .card { width: 1200px; height: 630px; padding: 64px 80px 0; display: grid; grid-template-rows: auto 1fr auto; }
  .logo { display: block; height: 56px; }
  .logo svg { height: 56px; width: auto; display: block; overflow: visible; }
  .body { align-self: center; max-width: 960px; padding-bottom: 8px; }
  .label {
    display: flex; align-items: center; gap: 16px; margin-bottom: 28px;
    font: 700 20px/1.3 "Manrope", Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--blue-300);
  }
  .label::before { content: ""; flex: none; width: 40px; height: 2px; background: var(--blue-500); }
  .title {
    font-family: "Bodoni Moda", Georgia, "Times New Roman", serif;
    font-weight: 500; font-size: 72px; line-height: 1.08; letter-spacing: -0.005em; font-variation-settings: "opsz" 11;
    color: #FFFFFF; text-wrap: balance; font-variant-numeric: lining-nums;
  }
  .foot {
    display: flex; align-items: center; justify-content: space-between; height: 88px;
    border-top: 1px solid var(--rule);
    font: 500 20px/1 "Manrope", Arial, sans-serif; color: var(--on-navy-2); letter-spacing: .005em;
  }
  .foot b { font-weight: 500; color: #FFFFFF; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">{{LOGO}}</div>
    <div class="body">
      <p class="label">{{LABEL}}</p>
      <h1 class="title" id="title">{{TITLE}}</h1>
    </div>
    <div class="foot"><b>kokreaters.com</b><span>Independent technical and strategy consulting</span></div>
  </div>
  <script>
    // Keep the title to three lines: step down from 72px only when it would wrap to a fourth (long article titles).
    (async function () {
      await document.fonts.ready;
      var t = document.getElementById('title');
      var size = 72;
      while (size > 44 && t.getBoundingClientRect().height > size * 1.08 * 3 + 1) { size -= 4; t.style.fontSize = size + 'px'; }
      document.body.setAttribute('data-ready', String(size));
    })();
  </script>
</body>
</html>
