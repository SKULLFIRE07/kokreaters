<!doctype html>
<!--
  KoKreaters Open Graph card (DESIGN-SPEC v2 5.1). 1200×627.
  Rendered by scripts/og.mjs through headless Chrome; never shipped as a page.
  Ink ground, the white horizontal lockup (vector, inline), a Saffron pillar bar, the title in the display face
  (Bricolage 800 / wdth 75), overline in IBM Plex Mono, and the node cluster on a die-cut sticker (true colours).
  og.mjs fills the OVERLINE, TITLE, LOGO and CLUSTER placeholders; fonts are served by og.mjs.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, height=627">
<style>
  @font-face {
    font-family: "Bricolage Grotesque";
    src: url("/fonts/bricolage-grotesque-latin-wdth-normal.woff2") format("woff2-variations");
    font-weight: 200 800; font-stretch: 75% 100%; font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
    font-weight: 500; font-display: block;
  }
  :root { --ink: #121833; --saffron: #F4C841; --lavender: #EADCFF; --white: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 627px; overflow: hidden; }
  body { background: var(--ink); -webkit-font-smoothing: antialiased; font-kerning: normal; color: var(--white); }
  .card { position: relative; width: 1200px; height: 627px; padding: 64px 72px 56px; display: grid; grid-template-rows: auto 1fr auto; row-gap: 28px; overflow: hidden; }
  .bars { position: absolute; left: 0; right: 0; top: 0; height: 14px; display: grid; grid-template-columns: 3fr 1fr 1fr 1fr 1fr 1fr; }
  .bars i:nth-child(1) { background: var(--saffron); } .bars i:nth-child(2) { background: #2C509E; } .bars i:nth-child(3) { background: #5B2A86; }
  .bars i:nth-child(4) { background: #C8457E; } .bars i:nth-child(5) { background: #8C5B88; } .bars i:nth-child(6) { background: #4C9BE8; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 28px 28px; }
  .logo { position: relative; display: block; height: 54px; }
  .logo svg { height: 54px; width: auto; display: block; isolation: isolate; overflow: visible; }
  .body { position: relative; align-self: center; max-width: 820px; }
  .overline {
    font: 500 18px/24px "IBM Plex Mono", "Courier New", monospace; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--lavender); margin-bottom: 18px; display: flex; gap: 12px; align-items: center;
  }
  .overline::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--saffron); box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--saffron); flex: none; }
  .title {
    font-family: "Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
    font-weight: 800; font-stretch: 75%; font-size: 84px; line-height: .92; letter-spacing: -0.025em;
    color: var(--white); text-wrap: balance; font-variant-numeric: lining-nums tabular-nums;
  }
  .foot { position: relative; display: flex; align-items: flex-end; justify-content: space-between; }
  .domain { font: 500 22px/1 "IBM Plex Mono", "Courier New", monospace; color: var(--saffron); letter-spacing: 0.02em; }
  .sticker { position: absolute; right: 56px; bottom: 48px; width: 230px; height: 230px; border-radius: 50%; background: var(--white);
    box-shadow: 0 0 0 8px var(--white), 0 22px 40px -12px rgba(0,0,0,.6); rotate: -6deg; display: grid; place-items: center; }
  .sticker svg { width: 172px; height: 172px; display: block; overflow: visible; isolation: isolate; }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="logo">{{LOGO}}</div>
    <div class="body">
      <p class="overline">{{OVERLINE}}</p>
      <h1 class="title" id="title">{{TITLE}}</h1>
    </div>
    <div class="foot"><span class="domain">kokreaters.com</span></div>
    <div class="sticker">{{CLUSTER}}</div>
  </div>
  <script>
    // Keep the title to three lines: step down only if 84px overflows (long article titles).
    (async function () {
      await document.fonts.ready;
      var t = document.getElementById('title');
      var size = 84;
      while (size > 52 && t.getBoundingClientRect().height > size * 0.92 * 3 + 1) { size -= 4; t.style.fontSize = size + 'px'; }
      document.body.setAttribute('data-ready', String(size));
    })();
  </script>
</body>
</html>
